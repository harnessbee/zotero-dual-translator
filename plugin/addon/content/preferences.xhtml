<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
</linkset>
<groupbox
  onload="Zotero.__addonInstance__.hooks.onPrefsEvent('load', { window })"
>
  <label><html:h2 data-l10n-id="pref-title"></html:h2></label>
  <checkbox
    id="zotero-prefpane-__addonRef__-enable"
    preference="enable"
    data-l10n-id="pref-enable"
  />
  <hbox>
    <html:label
      for="zotero-prefpane-__addonRef__-serviceURL"
      data-l10n-id="pref-service-url"
    ></html:label>
    <html:input
      type="text"
      id="zotero-prefpane-__addonRef__-serviceURL"
      preference="serviceURL"
    ></html:input>
  </hbox>
  <hbox>
    <html:label
      for="zotero-prefpane-__addonRef__-targetLang"
      data-l10n-id="pref-target-lang"
    ></html:label>
    <html:input
      type="text"
      id="zotero-prefpane-__addonRef__-targetLang"
      preference="targetLang"
    ></html:input>
  </hbox>
  <hbox>
    <html:label
      for="zotero-prefpane-__addonRef__-radius"
      data-l10n-id="pref-radius"
    ></html:label>
    <html:input
      type="number"
      min="0"
      max="5"
      id="zotero-prefpane-__addonRef__-radius"
      preference="radius"
    ></html:input>
  </hbox>
  <checkbox
    id="zotero-prefpane-__addonRef__-autoPrefetch"
    preference="autoPrefetch"
    data-l10n-id="pref-auto-prefetch"
  />
  <hbox>
    <html:label
      for="zotero-prefpane-__addonRef__-fontScale"
    >Font Scale</html:label>
    <html:input
      type="number"
      min="0.5"
      max="1.5"
      step="0.05"
      id="zotero-prefpane-__addonRef__-fontScale"
      preference="fontScale"
    ></html:input>
  </hbox>
</groupbox>
<vbox>
  <html:label
    data-l10n-id="pref-help"
    data-l10n-args='{"time": "__buildTime__","name": "__addonName__","version":"__buildVersion__"}'
  ></html:label>
</vbox>
